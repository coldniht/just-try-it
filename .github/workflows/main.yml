name: RDP-ONLY-GPU
on:
  workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      USR: Bullettemporary
      PASS: Bullet@12345
      GPU: NVIDIA GeForce RTX 3090
      DXURL: https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe
      TSURL: https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi
    steps:
    - name: GPU + DX9 Setup
      run: |
        $ErrorActionPreference = "Stop"
        $regVid = "HKLM:\SYSTEM\CurrentControlSet\Control\Video\{63791729-9463-4795-A91D-564872798364}\0000"
        New-Item -Path $regVid -Force | Out-Null
        Set-ItemProperty $regVid DeviceDescription "$env:GPU" -Type String -Force
        Set-ItemProperty $regVid HardwareInformation.MemorySize 0x04000000 -Type DWord -Force
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000" /v DriverDesc /t REG_SZ /d "$env:GPU" /f
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v EnableHardwareMode /t REG_DWORD /d 1 /f

        $dxExe = Join-Path $env:TEMP "dx_redist.exe"
        $dxDir = Join-Path $env:TEMP "dxinst"
        iwr $env:DXURL -OutFile $dxExe -UseBasicParsing -TimeoutSec 60
        New-Item -ItemType Directory -Path $dxDir -Force | Out-Null
        & $dxExe /Q /T:$dxDir
        Start-Sleep 6
        $dxSetup = Join-Path $dxDir "DXSETUP.exe"
        if(Test-Path $dxSetup){
          & $dxSetup /silent
        } else {
          cmd /c "`"$dxExe`" /Q /T:`"$dxDir`""
          Start-Sleep 8
          & $dxSetup /silent
        }

        reg add "HKLM\SOFTWARE\Microsoft\DirectX" /v Version /t REG_SZ /d "4.09.00.0904" /f
        reg add "HKLM\SOFTWARE\Microsoft\DirectX" /v Direct3DVersion /t REG_SZ /d "9.0c" /f
    - name: Tailscale
      run: |
        $tsBin = Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"
        if(-not (Test-Path $tsBin)){
          $tsMsi = Join-Path $env:TEMP "ts.msi"
          iwr $env:TSURL -OutFile $tsMsi -UseBasicParsing -TimeoutSec 60
          msiexec /i $tsMsi /quiet /norestart /log "$env:TEMP\ts.log"
          Start-Sleep 10
        }
        & $tsBin up --authkey "${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname bullet --accept-routes
        $tsIp = & $tsBin ip -4 | Select-Object -First 1
        echo "TAIL_IP=$tsIp" >> $env:GITHUB_ENV
    - name: Aktifkan RDP
      run: |
        $sec = ConvertTo-SecureString $env:PASS -AsPlainText -Force
        if(-not (Get-LocalUser $env:USR -ErrorAction SilentlyContinue)){
          New-LocalUser -Name $env:USR -Password $sec -UserMayChangePassword $false
        } else {
          Set-LocalUser -Name $env:USR -Password $sec
          Enable-LocalUser -Name $env:USR
        }
        Add-LocalGroupMember -Group Administrators -Member $env:USR -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:USR -ErrorAction SilentlyContinue
        Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0 -Type DWord -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        echo "`n=== LOGIN ==="
        echo "USER: $env:USR"
        echo "PASS: $env:PASS"
        echo "IP: $env:TAIL_IP"
    - name: Tetap Hidup
      run: |
        $end = (Get-Date).AddMinutes(358)
        while((Get-Date) -lt $end){
          echo "ALIVE $(Get-Date -f HH:mm:ss)"
          Start-Sleep 30
        }
        
